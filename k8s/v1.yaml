apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-v1
  template:
    metadata:
      labels:
        app: hospital-v1
    spec:
      containers:
        - name: hospital
          image: thirisha0306/hospital-system:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-v1-service
spec:
  type: NodePort
  selector:
    app: hospital-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001